name: CI

on:
  push:
    paths-ignore: ["**.md"]   # docs-only changes don't need a test run
  pull_request:
    paths-ignore: ["**.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true   # creates .venv and puts it on PATH for the next steps
          enable-cache: true
          cache-dependency-glob: requirements-test.txt
      - run: uv pip install -r requirements-test.txt
      - run: pytest -q
