# P1 experiment settings — every number the code uses lives here.
# Fill in each value from the decisions you made. Comments say what each key means.

data:
  holdout_share:   0.15      # share of all transactions set aside as the fixed holdout
  m0_days:     30           # days of data used to train the starting model M0

simulation:
  n_rounds:      8         # number of retrain rounds after M0
  blocking_share:   0.05      # share of each round's transactions blocked (top by score)
  pass_through_rates: [0.1, 0.05, 0.01]  # list of rates for the "fix" worlds
  seeds:   5               # number of repeated runs per world

models: ['xgboost', 'random_forest']                # which model families to train

evaluation:
  metric:       'AU-PR'          # headline metric

baseline:                    # v0.1: the deployed model, built before the feedback-loop experiment
  valid_share: 0.10          # time split: oldest 70% train, next 10% validation (early stopping), newest 20% test
  test_share:  0.20
  # Placeholder feature list (numeric only, transaction table only). Replace after EDA §7 screening.
  features: [TransactionAmt, card1, card2, card3, card5, addr1, addr2, dist1,
             C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14,
             D1, D2, D3, D4, D10, D15]
